  .wrap{max-width:480px;margin:0 auto;padding:14px 16px 28px;min-height:100dvh;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brand{font-weight:900;font-size:13px;line-height:1.15;text-transform:uppercase;letter-spacing:.03em}
  .brand span{color:var(--orange)}
  .pill{background:var(--paper);border:var(--line) solid var(--ink);border-radius:999px;padding:5px 12px;font-weight:900;font-size:15px;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
  .pill b{color:var(--orange)}
  .pill.hidden{visibility:hidden}
  .pill.bump{animation:bump .5s ease}
  @keyframes bump{40%{transform:scale(1.18) rotate(-3deg)}}

  .progress{display:flex;gap:4px;margin-bottom:14px}
  .progress span{flex:1;height:8px;border-radius:4px;background:#fff;border:2px solid var(--ink)}
  .progress span.done{background:var(--ink)}
  .progress span.now{background:var(--orange)}
  .progress span.gap{flex:0 0 6px;border:0;background:none}

  main{flex:1;display:flex;flex-direction:column}
  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- Dobrodruh + bublina ---------- */
  .talk{display:grid;grid-template-columns:86px 1fr;align-items:start;gap:30px;margin:4px 0 16px}
  .talk.big{grid-template-columns:112px 1fr}
  .hero{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.06));transform-origin:50% 100%}
  .hero.hop{animation:hop .6s ease}
  .hero.shake{animation:shake .5s ease}
  @keyframes hop{30%{transform:translateY(-12px) rotate(-4deg)}60%{transform:translateY(0) rotate(2deg)}}
  @keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
  .bubble{position:relative;background:var(--paper);border:var(--line) solid var(--ink);
    border-radius:22px 40px 36px 30px / 22px 34px 40px 36px;padding:16px 18px;margin-top:8px;min-height:64px;
    font-weight:800;font-size:18px;line-height:1.3}
  .talk.big .bubble{margin-top:18px}
  .bubble small{display:block;font-size:12px;font-weight:900;color:var(--orange);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .bubble .tail{position:absolute;left:-31px;top:14px;width:34px;height:30px;overflow:visible}
  .bubble.ok{background:var(--green-soft)} .bubble.ok .tail path{fill:var(--green-soft)}
  .bubble.no{background:var(--red-soft)} .bubble.no .tail path{fill:var(--red-soft)}
  .bubble p{margin:6px 0 0;font-weight:700;font-size:16px}

  /* ---------- Text, karty ---------- */
  h1{font-size:28px;line-height:1.1;margin:0 0 6px;font-weight:900}
  h2{font-size:22px;line-height:1.15;margin:0 0 10px;font-weight:900}
  p{margin:0 0 10px;line-height:1.45;font-size:16px}
  .card{background:var(--paper);border:var(--line) solid var(--ink);border-radius:22px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:14px}
  .prize{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:15px;line-height:1.35;font-weight:700}
  .prize + .prize{border-top:2px dashed #DDD}
  .prize .ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--orange-soft);border:2px solid var(--ink);display:grid;place-items:center;font-size:19px}
  .prize b{color:var(--orange)}
  .rules{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--muted);font-weight:700}
  .rules img{width:40px;flex:none}
  label.field{display:block;font-weight:900;font-size:14px;margin:4px 0 6px}
  input[type=email]{width:100%;font:inherit;font-weight:800;font-size:17px;padding:14px;border:var(--line) solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);outline:none}
  input[type=email]:focus{box-shadow:0 0 0 4px var(--orange-soft)}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;line-height:1.4;font-weight:700;cursor:pointer}
  .check input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border:var(--line) solid var(--ink);border-radius:7px;background:#fff;display:grid;place-items:center;cursor:pointer}
  .check input:checked{background:var(--orange)}
  .check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .err{color:var(--red);font-weight:800;font-size:14px;min-height:20px;margin-top:10px}
  .muted{color:var(--muted);font-size:14px}

  .btn{display:block;width:100%;border:var(--line) solid var(--ink);border-radius:18px;padding:15px;font:inherit;font-weight:900;font-size:19px;
    background:var(--orange);color:#fff;cursor:pointer;text-align:center;text-decoration:none;margin-top:14px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .btn[disabled]{opacity:.6;cursor:default}
  .btn.white{background:#fff;color:var(--ink)}
  .link{display:block;text-align:center;margin-top:14px;color:var(--ink);font-weight:900;font-size:15px;text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:3px;text-underline-offset:4px}
  .spacer{flex:1;min-height:6px}

  /* ---------- Otázka ---------- */
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .qhead .set{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
  .qhead .set span{color:var(--orange)}
  .clock{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:var(--line) solid var(--ink);border-radius:999px;padding:3px 10px 3px 6px;font-weight:900;font-size:16px;min-width:74px}
  .clock.warn{background:var(--orange);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .timer{height:14px;border:var(--line) solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin-bottom:12px}
  .timer i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left center}
  .timer.warn i{background:var(--orange)}
  .qimg{width:100%;aspect-ratio:4/3;border:var(--line) solid var(--ink);border-radius:20px;overflow:hidden;margin:0 0 14px;background:#fff;box-shadow:4px 4px 0 var(--ink)}
  .qimg img{width:100%;height:100%;object-fit:cover;display:block}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:var(--line) solid var(--ink);background:#fff;border-radius:16px;padding:11px 12px;
    font:inherit;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .opt .l{flex:none;width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900}
  .opt.correct{background:var(--green-soft)} .opt.correct .l{background:var(--green)}
  .opt.wrong{background:var(--red-soft)} .opt.wrong .l{background:var(--red)}
  .opt.dim{opacity:.55}
  .opt[disabled]{cursor:default}

  /* ---------- Výsledky, slidy ---------- */
  .score{display:inline-block;font-size:40px;font-weight:900;background:#fff;border:var(--line) solid var(--ink);border-radius:20px;padding:4px 18px;box-shadow:4px 4px 0 var(--ink);margin-bottom:12px}
  .score span{color:var(--orange)}
  .slide-title{font-size:26px;font-weight:900;line-height:1.1;margin:0 0 4px}
  .badge{display:inline-block;background:var(--orange);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  ul.facts{list-style:none;padding:0;margin:10px 0 0}
  ul.facts li{font-size:15px;line-height:1.35;font-weight:700;padding:6px 0}
  ul.facts li + li{border-top:2px dashed #E3E3E3}
  footer{text-align:center;font-size:13px;font-weight:900;margin-top:16px}
  footer span{color:var(--orange)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function addUtm(url, content){ return url + (url.includes("?")?"&":"?") + CONFIG.UTM + "&utm_content=" + content; }
function lsGet(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){return null} }
function lsSet(v){ try{localStorage.setItem(LS_KEY, JSON.stringify(v))}catch(e){} }
function fmt(n){ return Number(n).toLocaleString("cs-CZ"); }

function talk(html, opts={}){
  return `<div class="talk ${opts.big?"big":""}">
    <img class="hero" id="hero" src="${DOBRODRUH}" alt="Dobrodruh">
    <div class="bubble ${opts.cls||""}" id="bubble" style="color:${opts.cls==="ok"?"var(--green-soft)":opts.cls==="no"?"var(--red-soft)":"#fff"}">
      <div style="color:var(--ink)">${html}</div>${TAIL}
    </div>
  </div>`;
}

async function api(payload){
  if(!CONFIG.SCRIPT_URL){ return {ok:true, demo:true, played:false}; }
  const res = await fetch(CONFIG.SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
  return res.json();
}
async function apiRetry(payload){
  for(let i=0;i<3;i++){ try{ return await api(payload); }catch(e){ await new Promise(r=>setTimeout(r,800*(i+1))); } }
  return {ok:false, error:"network"};
}

function setPoints(bump){ const p=$("#pts"); p.innerHTML = `⭐ <b>${fmt(state.points)}</b> bodů`; p.classList.remove("hidden"); if(bump){p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump");} }
function renderProgress(){
  if(state.step<0 || !FLOW[state.step] || FLOW[state.step].t==="end"){ $("#prog").innerHTML=""; return; }
  const cur = FLOW[state.step];
  const doneQ = FLOW.slice(0, state.step).filter(f=>f.t==="q").length;
  let h="", n=0;
  SETS.forEach((set,si)=>{ if(si) h+=`<span class="gap"></span>`;
    set.questions.forEach(()=>{ h += `<span class="${n<doneQ?"done":(n===doneQ&&cur.t==="q"?"now":"")}"></span>`; n++; }); });
  $("#prog").innerHTML = h;
}
function show(html){ clearInterval(state.timer); screen.classList.remove("fade"); void screen.offsetWidth; screen.classList.add("fade"); screen.innerHTML = html; window.scrollTo(0,0); renderProgress(); }
function heroAnim(c){ const h=$("#hero"); if(!h) return; h.classList.remove("hop","shake"); void h.offsetWidth; h.classList.add(c); }

/* ---------- Úvod ---------- */
function intro(){
  state.step = -1; state.scores = [0,0,0]; state.points = 0; state.email = ""; $("#pts").classList.add("hidden");
  show(`
    ${talk(`<small>Minifestival 2026</small>Ahoj dobrodruzi! Zahrajete si se mnou kvíz? 🐾`, {big:true})}
    <h1>Poznáte svět malých dobrodruhů?</h1>
    <p>15 otázek o oblékání na ven, kombinézách WeeDo a našem obchodě. Na každou máte jen pár vteřin – hlídejte čas!</p>
    <div class="card">
      <div class="prize"><div class="ic">🎁</div><div><b>Sada 1</b> = vstup do <b>slosování o poukaz na ${CONFIG.POUKAZ}</b> (losujeme ${CONFIG.LOSOVANI}) a navíc si u našeho stánku můžete vyzvednout <b>omalovánky</b> 🖍️</div></div>
      <div class="prize"><div class="ic">⭐</div><div><b>Sada 2</b> = <b>${fmt(CONFIG.BODY_ZA_SADY[1])} bodů</b> na nákup, <b>sada 3</b> = + dalších <b>${fmt(CONFIG.BODY_ZA_SADY[2])} bodů</b>. Body připíšeme k vašemu účtu na e-shopu.</div></div>
    </div>
    <div class="rules"><img src="${CLIPBOARD}" alt=""><div><b style="color:var(--ink)">Pravidla:</b> hrát můžete jen jednou na jeden e-mail. 3 sady po 5 otázkách, čas na otázku 30 / 25 / 20 vteřin. Dohráním sady 1 jste ve slosování. Sady 2 a 3 jsou splněné při ${CONFIG.MIN_SPRAVNE} z 5 správných odpovědí. Body připíšeme jednou, k registraci na e-shopu se stejným e-mailem.</div></div>
    <div class="card" style="margin-top:14px">
      <label class="field" for="em">Váš e-mail</label>
      <input type="email" id="em" autocomplete="email" inputmode="email" placeholder="vas@email.cz">
      <label class="check"><input type="checkbox" id="rules"> <span>Souhlasím s pravidly hry a s využitím mého e-mailu pro účely soutěže (slosování a připsání bodů). <a href="https://www.promaledobrodruhy.cz/zasady-zpracovani-osobnich-udaju/" target="_blank" rel="noopener" style="color:var(--ink)">Zásady zpracování osobních údajů</a></span></label>
      <label class="check"><input type="checkbox" id="news"> <span>Chci dostávat novinky, tipy na výpravy a měsíční výzvy (nepovinné).</span></label>
      <div class="err" id="err"></div>
      <button class="btn" id="go" style="margin-top:6px">Hrát 🎯</button>
    </div>
    ${CONFIG.SCRIPT_URL ? "" : `<p class="muted" style="text-align:center">DEMO režim – nic se neukládá</p>`}
  `);
  $("#go").onclick = start;
}

async function start(){
  const email = $("#em").value.trim().toLowerCase();
  const err = $("#err");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err.textContent = "Zadejte prosím platný e-mail."; return; }
  if(!$("#rules").checked){ err.textContent = "Pro hraní je potřeba souhlas s pravidly a s využitím e-mailu."; return; }
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Chvilku…"; err.textContent = "";
  const src = new URLSearchParams(location.search).get("utm_source") || "";
  const r = await apiRetry({action:"start", email, rules:true, news:$("#news").checked, src});
  if(!r.ok){
    btn.disabled=false; btn.textContent="Hrát 🎯";
    err.textContent = r.error==="network" ? "Nepodařilo se připojit. Zkontrolujte internet a zkuste to znovu." : "Něco se nepovedlo, zkuste to prosím znovu.";
    return;
  }
  if(r.played){ lsSet({email, finished:true, points:r.points||0}); return alreadyPlayed(r.points||0); }
  state.email = email; lsSet({email, finished:false});
  next();
}

function alreadyPlayed(points){
  state.step = -1;
  show(`
    ${talk(`Tenhle e-mail už se mnou hrál! 🐾<p>Každý e-mail může hrát jen jednou.</p>`, {big:true})}
    <div class="card">
      ${points ? `<p>Máte u nás <b>${fmt(points)} bodů</b> – připíšeme je k registraci se stejným e-mailem.</p>` : ""}
      <p>A jste ve slosování o poukaz na <b>${CONFIG.POUKAZ}</b>. Držíme palce!</p>
      <p style="margin:0" class="muted">⚠️ Body můžeme připsat jen k <b>registrovanému účtu</b> na promaledobrodruhy.cz se stejným e-mailem. Ještě nejste registrovaní? Zaregistrujte se – jinak body nemáme kam připsat.</p>
    </div>
    <div class="spacer"></div>
    <a class="btn" href="${addUtm(CONFIG.ODKAZ_REGISTRACE,"uz_hral_registrace")}" target="_blank" rel="noopener">Zaregistrovat se a získat body</a>
    <a class="btn white" href="${addUtm(CONFIG.ODKAZ_WEEDO,"uz_hral")}" target="_blank" rel="noopener">Prohlédnout kombinézy WeeDo</a>
    <a class="link" href="#" id="back">Zpět na začátek</a>
  `);
  $("#back").onclick = (e) => { e.preventDefault(); intro(); };
}

/* ---------- Průchod ---------- */
function next(){
  state.step++;
  const f = FLOW[state.step];
  if(!f) return;
  if(f.t==="q") return question(f.s, f.i);
  if(f.t==="slide") return slide(SLIDES[f.k]);
  if(f.t==="result") return result(f.s);
  if(f.t==="end") return end();
}

function question(s, i){
  const set = SETS[s], q = set.questions[i];
  const letters = ["a","b","c","d"];
  show(`
    <div class="qhead">
      <div class="set">Sada ${s+1}: <span>${esc(set.name)}</span><br><span style="color:var(--muted)">otázka ${i+1}/5</span></div>
      <div class="clock" id="clock">⏱️ <span id="secs">${set.time}</span> s</div>
    </div>
    <div class="timer" id="tbar"><i id="tfill"></i></div>
    ${talk(`<span id="say">${esc(q.q)}</span>`)}
    ${q.img ? `<div class="qimg"><img src="${q.img}" alt="Detail kombinézy" style="transform:scale(${q.zoom||1});transform-origin:${q.pos||"50% 50%"}"></div>` : ""}
    <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${letters[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
  `);
  const total = set.time*1000, t0 = performance.now();
  const fill = $("#tfill"), secs = $("#secs"), bar = $("#tbar"), clock = $("#clock");
  let answered = false;
  const finish = (k) => {
    if(answered) return; answered = true; clearInterval(state.timer);
    const ok = k === q.a;
    if(ok) state.scores[s]++;
    screen.querySelectorAll(".opt").forEach(b=>{
      b.disabled = true; const bk = +b.dataset.k;
      if(bk===q.a) b.classList.add("correct"); else if(bk===k) b.classList.add("wrong"); else b.classList.add("dim");
    });
    clock.classList.remove("warn");
    const title = ok ? "Správně! 🎉" : (k===null ? "Čas vypršel! ⏰" : "Tentokrát ne…");
    const bubble = $("#bubble");
    bubble.classList.add(ok?"ok":"no"); bubble.style.color = ok ? "var(--green-soft)" : "var(--red-soft)";
    $("#say").innerHTML = `${title}<p>${esc(q.f)}</p>`;
    heroAnim(ok ? "hop" : "shake");
    $("#fb").innerHTML = `<button class="btn" id="nx">${i===4 ? "Vyhodnotit sadu" : "Další otázka →"}</button>`;
    $("#nx").onclick = next;
    setTimeout(()=>$("#nx").scrollIntoView({behavior:"smooth",block:"end"}), 50);
  };
  screen.querySelectorAll(".opt").forEach(b=> b.onclick = () => finish(+b.dataset.k));
  state.timer = setInterval(()=>{
    const left = Math.max(0, total - (performance.now()-t0));
    fill.style.transform = `scaleX(${left/total})`;
    secs.textContent = Math.ceil(left/1000);
    const warn = left <= 5000; bar.classList.toggle("warn",warn); clock.classList.toggle("warn",warn);
    if(left<=0) finish(null);
  }, 100);
}

function slide(sl){
  show(`
    ${talk(esc(sl.say), {big:true})}
    <div class="card">
      ${sl.img ? `<div class="qimg" style="box-shadow:none;margin-bottom:12px"><img src="${sl.img}" alt="Prodejna Pro malé dobrodruhy"></div>` : ""}
      <span class="badge">${sl.emoji} ${esc(sl.badge)}</span>
      <div class="slide-title">${esc(sl.title)}</div>
      <p style="margin-top:8px;margin-bottom:0;font-weight:${sl.list?800:600}">${esc(sl.text)}</p>
      ${sl.list ? `<ul class="facts">${sl.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </div>
    <div class="spacer"></div>
    <button class="btn" id="nx">Pokračovat →</button>
    ${sl.link ? `<a class="link" href="${sl.link.url()}" target="_blank" rel="noopener">${esc(sl.link.label)} ↗</a>` : ""}
  `);
  $("#nx").onclick = next;
}

async function result(s){
  const sc = state.scores[s], val = CONFIG.BODY_ZA_SADY[s];
  const entry = s===0;                                   // sada 1 = vstup do slosování
  const passed = entry || sc >= CONFIG.MIN_SPRAVNE;
  if(passed && val){ state.points += val; }
  const last = s===SETS.length-1;
  const say = entry ? `Hurá! Jste ve slosování o poukaz na ${CONFIG.POUKAZ}! 🎁<p>A u našeho stánku si můžete vyzvednout omalovánky 🖍️</p>`
            : passed ? `Hurá! Sada splněná! +${fmt(val)} bodů 🎉` : `Tahle sada nevyšla, ale nevěšte hlavu!`;
  const more = !last ? (s===0 ? "Další sada je o oblékání na ven." : "Poslední sada je nejtěžší – poznáte typ WeeDo jen podle detailu?") : "";
  show(`
    ${talk(say, {big:true, cls: passed?"ok":""})}
    <div class="card" style="text-align:center">
      <div class="score"><span>${sc}</span>/5</div>
      <p>${entry ? `A teď jde o body: za sadu 2 získáte <b>${fmt(CONFIG.BODY_ZA_SADY[1])} bodů</b>, za sadu 3 + dalších <b>${fmt(CONFIG.BODY_ZA_SADY[2])} bodů</b>.` : passed ? `Teď máte <b>${fmt(state.points)} bodů</b>.` : `Na splnění ${CONFIG.MIN_SPRAVNE-sc===1?"chyběla 1 správná odpověď":`chyběly ${CONFIG.MIN_SPRAVNE-sc} správné odpovědi`}. ${last ? "" : "Hrajete dál a body můžete získat v další sadě."}`}</p>
      ${more ? `<p style="margin:0" class="muted">${more}</p>` : ""}
    </div>
    <div class="spacer"></div>
    <button class="btn" id="nx" disabled>Ukládám…</button>
  `);
  if(passed){ if(val) setPoints(true); heroAnim("hop"); }
  const r = await apiRetry({action: last ? "finish" : "progress", email: state.email, set: s+1, score: sc});
  if(r && r.ok && typeof r.points==="number") { state.points = r.points; setPoints(false); }
  if(last) lsSet({email:state.email, finished:true, points:state.points});
  const b = $("#nx"); b.disabled = false; b.textContent = last ? "Zobrazit výsledek 🏆" : "Pokračovat →";
  if(r && !r.ok && r.error==="network"){ b.insertAdjacentHTML("beforebegin", `<p class="muted" style="text-align:center">Připojení kolísá – výsledek zkusíme uložit znovu na konci. Klidně pokračujte.</p>`); state.pending = {s, sc}; }
  b.onclick = next;
}

async function end(){
  if(state.pending){ await apiRetry({action:"finish", email:state.email, set:state.pending.s+1, score:state.pending.sc}); state.pending=null; }
  const total = state.scores.reduce((a,b)=>a+b,0);
  show(`
    ${talk(`Dohráno! ${total}/15 🏆<p>Děkuju, že jste si se mnou zahráli!</p>`, {big:true, cls:"ok"})}
    <div class="card">
      ${state.points
        ? `<p>Získali jste <b style="color:var(--orange)">${fmt(state.points)} bodů</b> na nákup. Připíšeme je k vašemu účtu na promaledobrodruhy.cz se stejným e-mailem (${esc(state.email)}).</p>
           <p class="muted">⚠️ Body můžeme připsat jen k <b>registrovanému účtu</b>. Ještě nemáte registraci? Zaregistrujte se pod tímto e-mailem – jinak body nemáme kam připsat.</p>`
        : `<p>Tentokrát bez bodů, ale nevadí!</p>`}
      <p style="margin:0">🎁 Jste ve <b>slosování o poukaz na ${CONFIG.POUKAZ}</b>. Losujeme ${CONFIG.LOSOVANI}.</p>
    </div>
    <div class="spacer"></div>
    <a class="btn" href="${addUtm(CONFIG.ODKAZ_REGISTRACE,"konec_registrace")}" target="_blank" rel="noopener">Zaregistrovat se a získat body</a>
    <a class="btn white" href="${addUtm(CONFIG.ODKAZ_WEEDO,"konec_weedo")}" target="_blank" rel="noopener">Prohlédnout kombinézy WeeDo</a>
  `);
  if(state.points) heroAnim("hop");
}

intro();
</script>
</body>
</html>
